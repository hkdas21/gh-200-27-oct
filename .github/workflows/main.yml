name: First-Workflow

on: push

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello from GH-200 Session from Himanshu!!!"

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: List files
        run: ls -la

      - name: Generate ASCII Art
        run: |
          sudo apt-get install -y figlet
          figlet "GH-200"
          echo "-----------------------------"
          figlet -f digital "GitHUB ACTIONS"
