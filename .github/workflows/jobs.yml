name: Jobs

on: [push]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🖥️ Run Greeting Script
        run: |
          chmod +x scripts/greet.sh
          ./scripts/greet.sh

  build:
    runs-on: ubuntu-latest
    needs: setup                    # ← Runs AFTER setup
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔨 Simulate Build
        run: |
          mkdir -p build-output
          echo "Build Report - $(date)" > build-output/build-report.txt
          echo "Commit: $GITHUB_SHA" >> build-output/build-report.txt
          echo "Branch: $GITHUB_REF_NAME" >> build-output/build-report.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-output/
          retention-days: 3

  test:
    runs-on: ubuntu-latest
    needs: build                    # ← Runs AFTER build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-report
    
      - name: Check Artifact
        run: |
          cat build-report.txt
